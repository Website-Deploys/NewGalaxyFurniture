# Netlify configuration â€” the ONLY production platform for New Galaxy Furniture.
#
# The whole application runs on Netlify: the prerendered public pages are served as static assets,
# and every on-demand route (`/admin/**`, `/api/**`, `/img/**`) runs as a Netlify Function emitted by
# the @astrojs/netlify adapter. Persistent data is Neon Postgres (leads, analytics, admin users) and
# Netlify Blobs (product images, admin sessions, drafts, rate-limit counters). Product/content JSON
# is still committed to the GitHub content repository by the admin write-back pipeline.
#
# There is no Cloudflare anywhere: no wrangler.toml, no Worker, no R2/D1/KV/Rate-Limiting binding.
#
# WHAT THIS FILE DECLARES, AND WHAT THE ADAPTER GENERATES
#   * `build.command` runs the project's own build (validate:content -> astro build -> post-build
#     audits). The @astrojs/netlify adapter writes the Functions into `.netlify/` and the redirects
#     that route on-demand paths to them.
#   * `build.publish` is the prerendered client output.
#   * The security headers and any manual redirects come from the build output's own
#     `dist/_headers` and `dist/_redirects` (emitted from data/site/redirects.json),
#     which Netlify reads from the publish directory â€” so there is one source of truth for each.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json engines is ">=22.12.0"; pin the Netlify build image's Node to 22.
  NODE_VERSION = "22"
  # These three are printed on the site by design (canonical origin, the two published contact
  # numbers) and are supposed to appear in the HTML â€” every canonical link, wa.me URL and tel: link.
  # They are declared as site environment variables; listing them here tells Netlify's secret scanner
  # that their presence in the output is intentional. Nothing else is omitted: a real secret reaching
  # the output still fails the build.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_SITE_URL,PUBLIC_WHATSAPP_NUMBERS,PUBLIC_PHONE_NUMBERS"

# The Astro adapter emits internal functions under `.netlify/functions-internal`; the nightly
# analytics Scheduled Function lives in the project's own functions directory.
[functions]
  directory = "netlify/functions"
  # The image pipeline decodes/encodes through WebAssembly; bundle those modules with the functions.
  node_bundler = "esbuild"

# Direct navigation and refresh: the adapter's generated `dist/_redirects` maps every
# on-demand route to its function and every prerendered route to its HTML, so opening or refreshing
# `/`, `/about`, `/workshop`, `/gallery`, `/contact`, `/custom-furniture`, `/collection/...`,
# `/product/...` and `/admin` all resolve server-side. No SPA catch-all is needed or wanted â€” this is
# a multi-page app, not a single-page bundle. Manual redirects, if any, stay in
# `public/_redirects` and are appended by the adapter.
